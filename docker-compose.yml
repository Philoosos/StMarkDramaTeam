services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: markramus_ticketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - markramus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d markramus_ticketing"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  markramus-postgres-data:

